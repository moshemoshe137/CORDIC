[project]
name = "CORDIC"
description = "A Python implementation of CORDIC algorithms."
version = "0.0.0"
authors = [{ name = "Moshe Rubin", email = "mosherubin137@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["flake8", "flake8-pyproject", "mypy", "notebook", "pre-commit", "ruff"]

testing = ["pytest", "pytest-cov", "pytest-random-order"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

########################################################################################
##################################### Tool Configs #####################################
########################################################################################

[tool.flake8]
select = ["DOC"]

[tool.mypy]
# When in doubt, borrowed from pandas
# https://github.com/pandas-dev/pandas/blob/417d1c94fe3810f695e94360a/pyproject.toml#L66
# Import discovery
ignore_missing_imports = true
# Untyped definitions and calls
check_untyped_defs = true
# disallow_untyped_calls = true
# disallow_untyped_decorators = true
disallow_untyped_defs = true
disallow_any_generics = true
# None and Optional handling
no_implicit_optional = true
# Configuring warnings
warn_redundant_casts = true
warn_unused_ignores = true
# Miscellaneous strictness flags
strict_equality = true
# Configuring error messages
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = """
--doctest-modules
--random-order-seed=0
--cov-report=xml
--cov-report=term-missing
--cov-branch
--cov=CORDIC
--cov=tests
"""
minversion = "8.0"
required_plugins = "pytest-random-order pytest-cov"
xfail_strict = true

[tool.ruff]
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "COM812", # Conflicts with `ruff format` and raises a warning.
    "ERA",    # Allow commented-out code.
    "FBT003", # Allow Boolean positional value in function call.
    "ISC001", # Conflicts with `ruff format` and raises a warning.
    "PD010",  # These `PD` rules are just outright wrong.
    "PD015",  # These `PD` rules are just outright wrong.
    "T20",    # Allow `print` statements.
    "RET",    # Allow return statements without an expression.
    "ANN002", # Checks that function `*args` arguments have type annotations.
    "ANN003", # Checks that function `**kwargs` arguments have type annotations.
    "ANN401", # Allow use of `typing.Any` in type annotations.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Use of `assert` detected
"**/__init__.py" = [
    "D104", # Missing docstring in public package
    "N999", # Invalid module name (Ruff doesn't like that CORDIC is all caps)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
