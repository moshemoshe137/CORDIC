name: Pre-Commit Tests - All OSes - Python 3.10, 3.11, 3.12, 3.13

on:
  push: # Trigger on any push
  pull_request: # Trigger on any Pull Request
  workflow_dispatch: # Allow manual runs
  schedule: # Run on Mondays at 01:00 AM Central Time (or 02:00 AM with DST)
    - cron: "0 7 * * MON"

jobs:
  tox-tests:
    name: >
      pre-commit - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't halt when one test fails
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools pre-commit
          python -m pip install --editable .

      - name: "`pre-commit` checks"
        run: pre-commit run --all-files --show-diff-on-failure
